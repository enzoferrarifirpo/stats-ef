<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats EF LIVE</title><style>body{margin:0;background:#eef2f7;color:#14263c;font:16px system-ui}main{max-width:1250px;margin:auto;padding:16px}header{background:#092b57;color:white;padding:18px;font-weight:bold}section{background:white;border-radius:12px;padding:16px;margin:12px 0;overflow:auto}.score{display:flex;justify-content:space-around;text-align:center;gap:10px;background:#092b57;color:white}.score b{font-size:44px;display:block}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}small{color:#526781}th,td{white-space:nowrap}th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:32px}th:nth-child(2),td:nth-child(2){position:sticky;left:48px;background:#fff;text-align:left}td:nth-child(4){font-weight:bold;background:#edf5ff}th{background:#e5edf7}.flag{font-size:32px;display:block}.teamtable{overflow:auto;margin-bottom:18px}</style><header>🏀 Stats EF LIVE</header><main><p id="status">Conectando…</p><section class="score" id="score"></section><section id="stats"></section><section id="actions"></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';
const db=getDatabase(initializeApp({"apiKey": "AIzaSyD4yqRXyD0-eItfEA42nlcXNmD6491kxvI", "authDomain": "stats-ef-live.firebaseapp.com", "databaseURL": "https://stats-ef-live-default-rtdb.firebaseio.com", "projectId": "stats-ef-live", "storageBucket": "stats-ef-live.firebasestorage.app", "messagingSenderId": "347674438707", "appId": "1:347674438707:web:92710c23eab5c3495b8746"})),id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const flag=name=>{const n=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return /\b(uruguay|uru)\b/.test(n)?'🇺🇾':/\b(paraguay|par)\b/.test(n)?'🇵🇾':/\b(brasil|brazil|bra)\b/.test(n)?'🇧🇷':/\b(surinam|suriname|sur)\b/.test(n)?'🇸🇷':''};const mins=v=>v==null?'—':Math.floor(v/60)+':'+String(v%60).padStart(2,'0');let last=null;function status(){if(last)$('status').textContent=last.final?'Partido finalizado':Date.now()-last.updated>18000?'Sin actualización reciente · último dato '+new Date(last.updated).toLocaleTimeString():'● EN VIVO · actualizado '+new Date(last.updated).toLocaleTimeString()};setInterval(status,1000);if(!/^[a-f0-9]{48}$/.test(id||''))$('status').textContent='Enlace inválido';else onValue(ref(db,'publicMatches/'+id),snap=>{const d=snap.val();if(!d){$('status').textContent='Esperando publicación';return}last=d;status();$('score').innerHTML=['A','B'].map(t=>'<div><span class="flag">'+flag(d.names[t])+'</span>'+esc(d.names[t])+'<b>'+esc(d.scores[t])+'</b></div>').join('<div>Período '+esc(d.period)+'<h2>'+esc(d.clock)+'</h2></div>');$('stats').innerHTML=['A','B'].map(t=>'<h3>'+flag(d.names[t])+' '+esc(d.names[t])+'</h3><div class="teamtable"><table><tr>'+['#','Nombre','MIN','PTS','3P','2P','TL','RO','RD','RT','AS','REC','TAP','TR','PER','FP','FR','VAL'].map(x=>'<th>'+x+'</th>').join('')+'</tr>'+Object.values(d.players?.[t]||{}).map(p=>'<tr>'+[p.n,p.name||'—',mins(p.min),p.pts,p.t3m+'/'+p.t3a,p.t2m+'/'+p.t2a,p.ftm+'/'+p.fta,p.ro??'—',p.rd??'—',p.reb,p.ast,p.rec,p.blk,p.br??'—',p.to??'—',p.pf,p.fr??'—',p.pir].map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table></div>').join('');$('actions').innerHTML='<h3>Últimas acciones</h3>'+Object.values(d.actions||{}).map(a=>'<p>'+esc(a.clock)+' · '+esc(d.names[a.t])+' #'+esc(a.n)+' · '+esc(({shot:a.made?'Tiro convertido':'Tiro errado',ft:a.made?'Libre convertido':'Libre errado',rebound:'Rebote',assist:'Asistencia',steal:'Recupero',block:'Tapón',turn:'Pérdida',foul:'Falta'})[a.type])+'</p>').join('')},e=>{$('status').textContent='No se pudo acceder: '+e.message});</script></html>
