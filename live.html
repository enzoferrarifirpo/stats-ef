<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats EF LIVE</title><style>body{margin:0;background:#eef2f7;color:#14263c;font:16px system-ui}main{max-width:850px;margin:auto;padding:16px}header{background:#092b57;color:white;padding:18px;font-weight:bold}section{background:white;border-radius:12px;padding:16px;margin:12px 0;overflow:auto}.score{display:flex;justify-content:space-around;text-align:center;gap:10px;background:#092b57;color:white}.score b{font-size:44px;display:block}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}small{color:#526781}</style><header>🏀 Stats EF LIVE</header><main><p id="status">Conectando…</p><section class="score" id="score"></section><section id="stats"></section><section id="actions"></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';
const db=getDatabase(initializeApp({"apiKey": "AIzaSyD4yqRXyD0-eItfEA42nlcXNmD6491kxvI", "authDomain": "stats-ef-live.firebaseapp.com", "databaseURL": "https://stats-ef-live-default-rtdb.firebaseio.com", "projectId": "stats-ef-live", "storageBucket": "stats-ef-live.firebasestorage.app", "messagingSenderId": "347674438707", "appId": "1:347674438707:web:92710c23eab5c3495b8746"})),id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let last=null;function status(){if(last)$('status').textContent=last.final?'Partido finalizado':Date.now()-last.updated>18000?'Sin actualización reciente · último dato '+new Date(last.updated).toLocaleTimeString():'● EN VIVO · actualizado '+new Date(last.updated).toLocaleTimeString()};setInterval(status,1000);if(!/^[a-f0-9]{48}$/.test(id||''))$('status').textContent='Enlace inválido';else onValue(ref(db,'publicMatches/'+id),snap=>{const d=snap.val();if(!d){$('status').textContent='Esperando publicación';return}last=d;status();$('score').innerHTML=['A','B'].map(t=>'<div>'+esc(d.names[t])+'<b>'+esc(d.scores[t])+'</b></div>').join('<div>Período '+esc(d.period)+'<h2>'+esc(d.clock)+'</h2></div>');$('stats').innerHTML=['A','B'].map(t=>'<h3>'+esc(d.names[t])+'</h3><table><tr>'+['#','PTS','REB','AST','REC','TAP','FP','PIR','2P','3P','TL'].map(x=>'<th>'+x+'</th>').join('')+'</tr>'+Object.values(d.players?.[t]||{}).map(p=>'<tr>'+[p.n,p.pts,p.reb,p.ast,p.rec,p.blk,p.pf,p.pir,p.t2m+'/'+p.t2a,p.t3m+'/'+p.t3a,p.ftm+'/'+p.fta].map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>').join('');$('actions').innerHTML='<h3>Últimas acciones</h3>'+Object.values(d.actions||{}).map(a=>'<p>'+esc(a.clock)+' · '+esc(d.names[a.t])+' #'+esc(a.n)+' · '+esc(({shot:a.made?'Tiro convertido':'Tiro errado',ft:a.made?'Libre convertido':'Libre errado',rebound:'Rebote',assist:'Asistencia',steal:'Recupero',block:'Tapón',turn:'Pérdida',foul:'Falta'})[a.type])+'</p>').join('')},e=>{$('status').textContent='No se pudo acceder: '+e.message});</script></html>
