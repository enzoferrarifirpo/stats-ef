<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats EF LIVE</title><style>body{margin:0;background:#eef2f7;color:#14263c;font:16px system-ui}main{max-width:1250px;margin:auto;padding:16px}header{background:#092b57;color:white;padding:18px;font-weight:bold}section{background:white;border-radius:12px;padding:16px;margin:12px 0;overflow:auto}.score{display:flex;justify-content:space-around;text-align:center;gap:10px;background:#092b57;color:white}.score b{font-size:44px;display:block}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}small{color:#526781}th,td{white-space:nowrap}th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:32px}th:nth-child(2),td:nth-child(2){position:sticky;left:48px;background:#fff;text-align:left}td:nth-child(4){font-weight:bold;background:#edf5ff}th{background:#e5edf7}.flag{font-size:32px;display:block}.teamtable{overflow:auto;margin-bottom:18px} .filters{display:flex;flex-wrap:wrap;gap:8px}.filters label{flex:1;min-width:100px;font-size:13px}.filters select{display:block;width:100%;padding:8px;border:1px solid #b7c5d5;border-radius:6px;background:white;color:#14263c}.court{max-width:420px;margin:12px auto}.action{border-bottom:1px solid #e0e6ee;padding:10px 0}.action b{display:block}.good{color:#15844f}.bad{color:#b52d3b}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1;padding:12px;border:0;border-radius:8px;background:#dce6f3;color:#092b57;font-weight:bold}.tabs button.active{background:#092b57;color:white}.teamtotal td,.teamtotal td:first-child,.teamtotal td:nth-child(2),.teamtotal td:nth-child(4){background:#1765a5;color:white;font-weight:700;border-bottom:0}.teamtotal td:nth-child(4){font-size:18px}.teamtotal .shotpct{display:block;font-size:12px;margin-top:3px;color:#fff;font-weight:700}</style><header>🏀 Stats EF LIVE</header><main><p id="status">Conectando…</p><section class="score" id="score"></section><nav class="tabs"><button data-tab="stats" class="active">Estadísticas</button><button data-tab="actions">Acciones</button><button data-tab="map">Mapa de tiro</button></nav><section id="stats"></section><section id="actions" hidden></section><section id="map" hidden><h3>Mapa de tiro</h3><div class="filters"><label>Selección<select id="mapTeam"><option value="A">Local</option><option value="B">Visitante</option></select></label><label>Jugador/a<select id="mapPlayer"></select></label><label>Período<select id="mapPeriod"></select></label></div><div id="mapView"></div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';
const db=getDatabase(initializeApp({"apiKey": "AIzaSyD4yqRXyD0-eItfEA42nlcXNmD6491kxvI", "authDomain": "stats-ef-live.firebaseapp.com", "databaseURL": "https://stats-ef-live-default-rtdb.firebaseio.com", "projectId": "stats-ef-live", "storageBucket": "stats-ef-live.firebasestorage.app", "messagingSenderId": "347674438707", "appId": "1:347674438707:web:92710c23eab5c3495b8746"})),id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const flag=name=>{const n=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return /\b(uruguay|uru)\b/.test(n)?'🇺🇾':/\b(paraguay|par)\b/.test(n)?'🇵🇾':/\b(brasil|brazil|bra)\b/.test(n)?'🇧🇷':/\b(surinam|suriname|sur)\b/.test(n)?'🇸🇷':/\b(colombia|col)\b/.test(n)?'🇨🇴':/\b(chile|chi)\b/.test(n)?'🇨🇱':/\b(venezuela|ven)\b/.test(n)?'🇻🇪':/\b(peru|per)\b/.test(n)?'🇵🇪':''};const mins=v=>v==null?'—':Math.floor(v/60)+':'+String(v%60).padStart(2,'0');let last=null;function status(){if(last)$('status').textContent=last.final?'Partido finalizado':Date.now()-last.updated>18000?'Sin actualización reciente · último dato '+new Date(last.updated).toLocaleTimeString():'● EN VIVO · actualizado '+new Date(last.updated).toLocaleTimeString()};

function teamTotal(d,t){const ps=arr(d.players?.[t]);const sum=k=>ps.reduce((a,p)=>a+(Number(p[k])||0),0);const stat=k=>ps.some(p=>p[k]!=null)?sum(k):'—';const pair=(m,a)=>{const made=stat(m),attempts=stat(a);const pct=typeof made==='number'&&typeof attempts==='number'&&attempts>0?(made/attempts*100).toLocaleString('es-UY',{maximumFractionDigits:1})+'%':'—';return esc(made)+'/'+esc(attempts)+'<span class="shotpct">'+esc(pct)+'</span>';};const cell=x=>'<td>'+esc(x)+'</td>';return '<tr class="teamtotal">'+['','TOTAL EQUIPO',mins(sum('min')),d.scores[t]].map(cell).join('')+[['t3m','t3a'],['t2m','t2a'],['ftm','fta']].map(([m,a])=>'<td>'+pair(m,a)+'</td>').join('')+['ro','rd','reb','ast','rec','blk','br','to','pf','fr','pir'].map(k=>cell(stat(k))).join('')+'</tr>'; }

function renderMap(d){options($('mapTeam'),['A','B'].map(t=>[t,flag(d.names[t])+' '+d.names[t]]));const t=$('mapTeam').value;options($('mapPlayer'),[['all','Todo el equipo'],...arr(d.players?.[t]).map(p=>[p.n,person(d,t,p.n)])]);options($('mapPeriod'),[['all','Partido completo'],...Array.from({length:Math.max(4,Number(d.period)||1)},(_,i)=>[i+1,i<4?'Cuarto '+(i+1):'Prórroga '+(i-3)])]);const n=$('mapPlayer').value,q=$('mapPeriod').value;const shots=arr(d.shots).filter(s=>s.t===t&&(n==='all'||String(s.n)===n)&&(q==='all'||String(s.period)===q));const valid=shots.filter(s=>typeof s.x==='number'&&typeof s.y==='number'&&s.x>=0&&s.x<=1&&s.y>=0&&s.y<=1);const dots=valid.map(s=>{const x=s.x*300,y=s.y*340;return '<g><circle cx="'+x+'" cy="'+y+'" r="8" fill="'+(s.made?'#15844f':s.blocked?'#bd7415':'#cf3b48')+'" stroke="white" stroke-width="1.5"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="11" font-weight="bold" fill="white">'+(s.made?'✓':s.blocked?'T':'×')+'</text><title>'+esc(person(d,t,s.n))+' · '+esc(s.pts)+' puntos</title></g>'}).join('');const ratio=a=>{const m=a.filter(s=>s.made).length;return m+'/'+a.length+' ('+(a.length?Math.round(m/a.length*100)+'%':'—')+')'};$('mapView').innerHTML='<div class="court"><svg viewBox="0 0 300 340" width="100%" role="img" aria-label="Mapa de lanzamientos"><rect x="1" y="1" width="298" height="338" fill="#f7e8d1" stroke="#9e7c56" stroke-width="2"/><path d="M100 1 V145 H200 V1 M100 145 A50 50 0 0 0 200 145 M18 1 V68 A132 132 0 0 0 282 68 V1 M126 1 V37 H174 V1" stroke="#9e7c56" stroke-width="2.5" fill="none"/><circle cx="150" cy="51" r="8" stroke="#9e7c56" fill="none" stroke-width="2"/>'+dots+'</svg></div><p><span class="good">● Convertido</span> · <span class="bad">× Errado</span> · <span style="color:#a36512">T Taponado</span></p><p><b>Dobles:</b> '+ratio(shots.filter(s=>s.pts===2))+' · <b>Triples:</b> '+ratio(shots.filter(s=>s.pts===3))+'</p><p><b>Total de campo:</b> '+ratio(shots)+'</p>'+(!shots.length?'<p>Sin lanzam setInterval(status,1000);if(!/^[a-f0-9]{48}$/.test(id||''))$('status').textContent='Enlace inválido';else onValue(ref(db,'publicMatches/'+id),snap=>{const d=snap.val();if(!d){$('status').textContent='Esperando publicación';return}last=d;status();$('score').innerHTML=['A','B'].map(t=>'<div><span class="flag">'+flag(d.names[t])+'</span>'+esc(d.names[t])+'<b>'+esc(d.scores[t])+'</b></div>').join('<div>Período '+esc(d.period)+'<h2>'+esc(d.clock)+'</h2></div>');$('stats').innerHTML=['A','B'].map(t=>'<h3>'+flag(d.names[t])+' '+esc(d.names[t])+'</h3><div class="teamtable"><table><tr>'+['#','Nombre','MIN','PTS','3P','2P','TL','RO','RD','RT','AS','REC','TAP','TR','PER','FP','FR','VAL'].map(x=>'<th>'+x+'</th>').join('')+'</tr>'+Object.values(d.players?.[t]||{}).map(p=>'<tr>'+[p.n,p.name||'—',mins(p.min),p.pts,p.t3m+'/'+p.t3a,p.t2m+'/'+p.t2a,p.ftm+'/'+p.fta,p.ro??'—',p.rd??'—',p.reb,p.ast,p.rec,p.blk,p.br??'—',p.to??'—',p.pf,p.fr??'—',p.pir].map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+teamTotal(d,t)+'</table></div>').join('');renderActions(d);renderMap(d)},e=>{$('status').textContent='No se pudo acceder: '+e.message});</script></html>
